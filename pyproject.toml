[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restgen"
version = "0.1.0"
description = "Compile-time REST API code generator for FastAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "restgen contributors" },
]
keywords = ["fastapi", "code-generator", "rest-api", "openapi", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
format = ["black>=24.0", "ruff>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/abhishek17569/restgen"
Documentation = "https://github.com/abhishek17569/restgen"
Repository = "https://github.com/abhishek17569/restgen"
Issues = "https://github.com/abhishek17569/restgen/issues"

[project.scripts]
restgen = "restgen.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/restgen"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
